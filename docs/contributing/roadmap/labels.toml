color = "006B75"
description = "Text-to-speech synthesis, voice cloning, prompt cache"
group = "domain"
why = "覆盖 tools/omni/token2wav/、tts-condition-graph.*、voxcpm2/、tools/tts/。当前用户提问最集中的领域。"

[[labels]]
