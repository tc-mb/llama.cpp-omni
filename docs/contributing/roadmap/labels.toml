# 标签定义 -- 单一来源
#
# 用途：新机器 / 新仓库 fork 之后，用这份定义把标签一次补齐。
#     python3 scripts/roadmap/apply-labels.py            # dry-run，只打印
#     python3 scripts/roadmap/apply-labels.py --apply    # 实际创建
#
# 默认只创建"缺失"的标签，不会覆盖已存在标签的颜色和描述。
# 要强制更新已有标签，加 --update-existing。
#
# 背景：标签存在仓库设置里，不在 git 里，所以 fork 不会带过来。
# 结果是 .github/ 下的模板和 close-issue.yml 引用了一批从来就不存在的标签，
# 而 GitHub 对不存在的标签是"静默跳过、不报错"。
# 详见 docs/contributing/roadmap/README.md 与仓库 issue 讨论。
#
# 字段：
#     name        必填  标签名（必须与 .github/ 下引用完全一致，含空格与 emoji）
#     color       必填  6 位十六进制，不带 '#'
#     description 必填  标签描述，会显示在 GitHub UI 上
#     group       必填  分组，便于人工核对
#     why         必填  为什么需要这个标签。写不出 why 的标签就不要加。


# ---------------------------------------------------------------------------
# 第 1 组：roadmap 机制必需
# ---------------------------------------------------------------------------

[[labels]]
name = "roadmap"
color = "BFDADC"
description = "Part of the community roadmap"
group = "roadmap"
why = "close-issue.yml 的 stale 豁免名单里有它。没有这个标签，公开的任务清单 issue 会在 44 天后被 stale bot 自动关闭。"

[[labels]]
name = "difficulty: easy"
color = "0E8A16"
description = "One file, no architecture knowledge needed, can be self-tested locally"
group = "difficulty"
why = "任务清单的四级难度刻度之一。判据见 docs/contributing/roadmap/README.md 第 5 节。"

[[labels]]
name = "difficulty: medium"
color = "FBCA04"
description = "Needs one submodule understood, touches 2-3 files, may need a model run to verify"
group = "difficulty"
why = "任务清单的四级难度刻度之一。"

[[labels]]
name = "difficulty: hard"
color = "D93F0B"
description = "Large but understood work: a port, a restructure, or offloading to an existing backend"
group = "difficulty"
why = "任务清单的四级难度刻度之一。与 expert 的区别是路径已知，只是工程量大。"

[[labels]]
name = "difficulty: expert"
color = "8B0000"
description = "Original development: the approach is not known yet and needs design work first"
group = "difficulty"
why = "任务清单的四级难度刻度之一。与 hard 的区别是没有现成答案可抄，需要先做设计、大概率要先写提案，且有走不通的风险。"


# ---------------------------------------------------------------------------
