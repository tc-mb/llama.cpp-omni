group = "domain"
why = "覆盖 src/models/** 与 src/llama-model.cpp。上游 labeler 的 model 规则只匹配 src/models/**，且该标签在本仓库缺失。"

[[labels]]
name = "devops"
color = "6E7781"
description = "CI, workflows, repository automation"
group = "domain"
why = "覆盖 .github/ 与 ci/。上游 labeler 引用了它但本仓库没有，导致 CI 相关 PR 无法被自动归类。"

[[labels]]
name = "demo"
color = "BFD4F2"
description = "Python demo (OpenBMB/MiniCPM-o-Demo)"
group = "domain"
why = "任务清单里有若干任务改的是 demo 仓库而不是引擎本身。用独立标签把它们标出来，贡献者才不会点进去才发现仓库不对。"

[[labels]]
