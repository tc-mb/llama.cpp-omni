# 这些标签已经存在，颜色是仓库里的实际值（多数是 GitHub 默认灰 ededed）。
# 列在这里是为了让本文件成为标签的完整定义，apply-labels.py 会跳过它们。
# 想让它们的颜色更易区分，改这里的 color 然后跑 --apply --update-existing。
# 注意：改颜色是纯外观改动，不影响任何自动化行为（自动化只看名字）。
# ---------------------------------------------------------------------------

