# ---------------------------------------------------------------------------
# 第 4 组：修复失效的模板引用
#
# 这几个标签被 .github/ISSUE_TEMPLATE/*.yml 引用，但仓库里不存在，
# 所以用对应模板提的 issue 一个标签都拿不到（实测 issue #114 标签为空）。
# 注意：compilation 与 model evaluation 在上游 llama.cpp 里也不存在（404），
# 属于上游自带的同一个 bug，不是 fork 引入的。
# ---------------------------------------------------------------------------

[[labels]]
name = "bug-unconfirmed"
color = "FEF2C0"
description = "Reported bug, not yet confirmed by a maintainer"
group = "bug-flow"
why = "010/011/019 三个 bug 模板都引用它。用于区分\"用户报的\"和\"已确认的\"，否则 bug 队列无法分级。"

[[labels]]
name = "compilation"
color = "D4C5F9"
description = "Build or compilation failure"
group = "bug-flow"
why = "010-bug-compilation.yml 引用它。注意不要与已有的 build 标签混用：build 由 labeler 按 cmake 路径自动打，compilation 表示编译报错。"

[[labels]]
name = "model evaluation"
color = "C5DEF5"
description = "Model output quality, accuracy or correctness issue"
group = "bug-flow"
why = "011-bug-results.yml 引用它，用于把效果类问题与崩溃类问题分开。"

[[labels]]
name = "research 🔬"
color = "43C54B"
description = "Technical research area, not a task yet"
group = "bug-flow"
why = "030-research.yml 引用它，且它在 close-issue.yml 的 stale 豁免名单里。缺失导致 Research issue 会被自动关闭（issue #88 正在发生这个问题）。"

[[labels]]
name = "refactoring"
color = "F4A25B"
description = "Refactoring"
group = "bug-flow"
why = "040-refactor.yml 引用的是 'refactor'，而 close-issue.yml 豁免的是 'refactoring' -- 两个名字不一致，且都不存在。本文件统一用上游的 'refactoring'，模板需同步修改。"

[[labels]]
name = "security"
color = "B60205"
description = "Security issue"
group = "bug-flow"
why = "close-issue.yml 的 stale 豁免名单里有它。安全问题绝不能被自动关闭。"


# ---------------------------------------------------------------------------
# 第 5 组：贡献漏斗（这两个本仓库已有，列出仅为自文档化）
# ---------------------------------------------------------------------------

[[labels]]
name = "good first issue"
color = "7057FF"
description = "Good for newcomers"
group = "funnel"
why = "GitHub 特殊标签，会被仓库侧栏和 github.com/explore 曝光，自建标签拿不到这个流量。难度为 easy 且对新人安全的任务应额外打上它。"

[[labels]]
name = "help wanted"
color = "008672"
description = "Extra attention is needed"
group = "funnel"
why = "标注需要人手的任务，且在 close-issue.yml 的 stale 豁免名单里。"


# ---------------------------------------------------------------------------
# 明确不创建的标签
#
# .github/labeler.yml 从上游继承了一批规则，引用了下面这些标签。它们是上游
# llama.cpp 支持的硬件后端或方向，本项目并未声明支持。真开始支持了再建。
#
#   SYCL, IBM zDNN, AMD ZenDNN, OpenCL, Hexagon, WebGPU, OpenVINO   -- 硬件后端
#   android, nix, server/ui, jinja parser, embedding                -- 上游方向
#
# 在这些标签不存在时，labeler 会静默跳过对应规则，PR 少一个标签而已，无害。
# 见 docs/contributing/roadmap/README.md 第 6 节末尾关于"受众/负责人/规则"的纪律。
# ---------------------------------------------------------------------------
