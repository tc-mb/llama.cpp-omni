title = "Deploy the demo via the cpp backend and diagnose the audio problems"
title_zh = "通过 cpp 部署 demo，排查音频问题"
difficulty = "medium"
domain = "audio"
note = "Cross-repo: OpenBMB/MiniCPM-o-Demo (Comni branch). The audio problems are probably several distinct issues, so narrow down what actually breaks before fixing."
note_zh = "跨仓库：OpenBMB/MiniCPM-o-Demo（Comni 分支）。音频问题可能有好几个不同原因，先定位清楚到底哪里坏了再动手。"

[[tasks]]
id = "T-006"
title = "Improve the Python demo UI"
title_zh = "优化 py demo 界面，目前不是很美观"
difficulty = "medium"
domain = "demo"
note = "Cross-repo: OpenBMB/MiniCPM-o-Demo (Comni branch). Needs a concrete list of what looks wrong before starting, otherwise the scope is unbounded."
note_zh = "跨仓库：OpenBMB/MiniCPM-o-Demo（Comni 分支）。动手前先列清楚具体哪里不好看，否则范围没法收敛。"

[[tasks]]
