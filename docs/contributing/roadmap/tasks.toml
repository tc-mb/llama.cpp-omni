# ===========================================================================
# Hard
# ===========================================================================

[[tasks]]
id = "T-015"
title = "Catch up the engine with upstream llama.cpp"
difficulty = "hard"
domain = "build"
umbrella = true
note = "Umbrella. The server layer has diverged structurally, so this is a port rather than a rebase. Do not attempt the whole thing in one pull request."

[[tasks]]
id = "T-016"
title = "Phase 1: catch up src/ and ggml/ with upstream"
difficulty = "medium"
domain = "ggml"
parent = "T-015"
note = "The least entangled layers. Land this first and independently so the rest has a stable base."

[[tasks]]
id = "T-017"
title = "Phase 2: port tools/mtmd and the vision and audio encoders"
difficulty = "hard"
domain = "vision"
parent = "T-015"
note = "mtmd changes upstream frequently and the omni fork depends on it. Expect real semantic conflicts, not just textual ones."

[[tasks]]
id = "T-018"
title = "Phase 3: restructure tools/server to match the upstream module split"
difficulty = "hard"
domain = "server"
parent = "T-015"
note = "Omni keeps the old monolithic server.cpp at ~6829 lines and layers about 3000 lines of its own files on top. Upstream split it into server-http, server-schema, server-stream and server-mcp."

[[tasks]]
id = "T-019"
title = "Run the omni pipeline on the WebGPU backend"
difficulty = "hard"
domain = "ggml"
kind = "research"
umbrella = true
note = "The WebGPU backend already exists in ggml and has CI, so this is not a feasibility question. The open question is which parts of the omni pipeline it can actually carry."

[[tasks]]
id = "T-020"
title = "Survey which operators omni needs and which the WebGPU backend implements"
difficulty = "medium"
domain = "ggml"
parent = "T-019"
kind = "research"
note = "Do this first. The answer decides whether the rest of the umbrella is worth attempting, and how to split it."

[[tasks]]
id = "T-021"
title = "Try the vision encoder on the WebGPU backend"
difficulty = "hard"
domain = "vision"
parent = "T-019"
kind = "research"
note = "Most likely part of the pipeline to work, since vision is the most conventional compute. TTS vocoder and audio frontend are the risky parts."

[[tasks]]
id = "T-022"
title = "Support additional full-duplex streaming model architectures"
difficulty = "hard"
domain = "model"
umbrella = true
note = "Umbrella. Adding an omni architecture means a new vision encoder, audio encoder, TTS head and duplex protocol together."

[[tasks]]
id = "T-023"
title = "Document the requirements a model has to meet to be duplex-capable"
difficulty = "medium"
domain = "docs"
parent = "T-022"
note = "Write this before adding a second model. It is also the answer to most questions about which models could be supported."

[[tasks]]
id = "T-024"
title = "Support multiple concurrent full-duplex sessions"
difficulty = "expert"
domain = "duplex"
note = "Original development. The server hardcodes n_parallel = 1 and documents itself as single-session, but making it multi-session means designing the whole session and KV lifecycle rather than porting an existing answer. Expect to need a written proposal first. Prior capacity analysis on O4.5 and O5 exists in the Comni notes."

[[tasks]]
id = "T-025"
title = "Operator-level inference acceleration"
difficulty = "expert"
domain = "ggml"
kind = "research"
umbrella = true
note = "Umbrella. Too broad as a single task. Concrete targets are added as subtasks, each with a measurable baseline."

[[tasks]]
id = "T-026"
title = "Move the HiFiGAN vocoder off the CPU on Metal"
difficulty = "hard"
domain = "tts"
parent = "T-025"
note = "Documented at about 220ms per chunk on CPU on M4 Max, which is the largest single stage in the TTS budget there."

[[tasks]]
id = "T-027"
title = "Speed up the Token2Mel stage on Metal"
difficulty = "medium"
domain = "tts"
parent = "T-025"
note = "Documented at about 235ms per chunk on M4 Max. Already on Metal, so this is optimization rather than offload."

[[tasks]]
