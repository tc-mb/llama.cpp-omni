# llama.cpp-omni 社区任务清单 -- 唯一真相源
#
# 这个文件是公开 issue 正文的唯一来源。公开 issue 是生成物，不要直接编辑 issue 正文。
# 规范见同目录 README.md。改动后必须跑：
#     python3 scripts/roadmap/render.py --check
#
# 硬规则
#     1. ID 格式 T-NNN，从 T-001 开始连续递增
#     2. 已经分配过的 ID 永不复用、永不重排、永不修改
#     3. 只追加，不重排已有条目
#     4. 伞形条目（umbrella = true）必须排在它的子任务之前
#
# 字段说明
#     id         必填  字符串，格式 T-NNN（至少 3 位数字，不足补零）
#     title      必填  字符串，英语，一句话说清"要达成什么"
#     difficulty 必填  easy / medium / hard / expert
#                       easy   = 一个文件，不需要架构知识，本地可自测
#                       medium = 需要理解一个子模块，跨 2-3 个文件
#                       hard   = 工程量大的已知路径（移植、重构、搬到已有后端）
#                       expert = 原创开发，方法尚未确定，需要先设计
#     domain     必填  vision / audio / tts / duplex / server / model / ggml
#                       / conversion / python / build / docs / devops / demo / app
#     issue      可选  整数，已存在的 GitHub issue 编号（不带 #）
#     owner      可选  字符串，认领者 GitHub 用户名（不带 @）
#     note       可选  字符串，前置条件或补充说明
#     umbrella   可选  布尔，标记为伞形条目（下面可以挂子任务）
#     parent     可选  字符串，指向所属伞形条目的 ID
#     kind       可选  task（默认）/ research
#
# 注意：跨仓库任务（domain 为 demo 或 app）不修改本仓库代码，note 里写明了实际仓库，
# 认领时请到对应仓库开 issue 与 PR。


# ===========================================================================
# Easy
# ===========================================================================

[[tasks]]
id = "T-001"
title = "Audit the README Quick Start against a clean clone and fix every step that no longer works"
difficulty = "easy"
domain = "docs"
note = "Walk the documented commands on a fresh machine and fix whatever is stale or wrong. Nothing to understand about the architecture."

[[tasks]]
id = "T-002"
title = "Add more end-to-end use cases with sample inputs and expected output"
difficulty = "easy"
domain = "docs"
note = "Pick a realistic scenario, run it against the shipped model, and write it up with the exact commands and the output you got."

[[tasks]]
id = "T-003"
title = "Add your own hardware's measured results to the benchmark tables"
difficulty = "easy"
domain = "docs"
note = "The tables currently cover RTX 4090 and M4 Max only. Run the shipped benchmark and add a row for your device, stating the exact setup."

[[tasks]]
id = "T-004"
title = "Run the Python demo on your platform and report what breaks"
difficulty = "easy"
domain = "demo"
note = "Cross-repo: OpenBMB/MiniCPM-o-Demo (Comni branch). Testing task, not a fixing task. Windows and Linux coverage is thin."


