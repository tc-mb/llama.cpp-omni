note_zh = "demo 那部分跨仓库（OpenBMB/MiniCPM-o-Demo，Comni 分支），引擎侧在本仓库。优化前先量清楚时间花在哪。"


# ===========================================================================
# Hard
# ===========================================================================

[[tasks]]
id = "T-010"
title = "Rework the app frontend - the iOS and Windows builds have poor UX and various errors"
title_zh = "重做 app 前端（目前 iOS 和 Win 版本体验不佳，各种情况有报错）"
difficulty = "hard"
domain = "app"
note = "Cross-repo: OpenBMB/MiniCPM-V-Apps. A frontend rewrite is a multi-week effort. The reported UX problems and the actual errors are two separate lists - separate them before starting."
note_zh = "跨仓库：OpenBMB/MiniCPM-V-Apps。前端重做是数周级工程。体验问题和报错是两件事，开工前先分开列清楚。"

[[tasks]]
id = "T-011"
title = "Sync with a new upstream llama.cpp branch and resolve the conflicts"
title_zh = "同步上游 llama.cpp 新分支，解决冲突"
difficulty = "hard"
domain = "build"
note = "The server layer has diverged structurally, so this is closer to a port than a rebase. Do not attempt it in one pull request."
note_zh = "server 层已经结构性分叉了，所以这更接近移植而不是 rebase。不要试图在一个 PR 里做完。"

[[tasks]]
id = "T-012"
title = "Explore the feasibility of WebGPU - can be split into smaller subtasks"
title_zh = "探索 WebGPU 的可行性，可拆分成多个简单级别的子任务"
difficulty = "hard"
domain = "ggml"
note = "The WebGPU backend already exists in ggml and has CI, so the open question is not whether it builds, but which parts of the omni pipeline it can carry."
note_zh = "ggml 里 WebGPU 后端已经存在而且有 CI，所以待回答的不是「能不能编过」，而是 omni 的哪些环节能真正跑在它上面。"

[[tasks]]
id = "T-013"
title = "Support other full-duplex streaming models"
title_zh = "适配支持其他类似全双工流式模型"
difficulty = "hard"
domain = "model"
note = "Adding an omni architecture means a new vision encoder, audio encoder, TTS head and duplex protocol together. Start from what the current architecture actually requires."
note_zh = "新增一个 omni 架构意味着同时要接新的视觉编码器、音频编码器、TTS 头和双工协议。先从现有架构到底要求什么开始梳理。"


# ===========================================================================
# Expert
# ===========================================================================

[[tasks]]
id = "T-014"
title = "Support multi-session full-duplex real-time streaming inference"
title_zh = "支持多 session 的全双工实时流式推理"
difficulty = "expert"
domain = "duplex"
note = "Original development. The server hardcodes n_parallel = 1 and documents itself as single-session, but making it multi-session means designing the whole session and KV lifecycle rather than porting a known answer. Expect to need a written proposal first."
note_zh = "原创开发。服务端把 n_parallel 写死为 1、并明确声明自己是单会话设计；要做多会话得把整个 session 与 KV 生命周期设计出来，没有现成答案可抄。预期需要先写提案。"

[[tasks]]
id = "T-015"
title = "Better operator-level inference acceleration"
title_zh = "更优的算子级别的推理加速"
difficulty = "expert"
domain = "ggml"
note = "Original development and too broad to act on as written. Needs to be broken into concrete targets, each with a measurable baseline, before any code."
note_zh = "原创开发，而且目前太笼统、没法直接动手。在写代码之前需要先拆成具体目标，每个目标都要有可衡量的基线。"
