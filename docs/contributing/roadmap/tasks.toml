# llama.cpp-omni 社区任务清单 -- 唯一真相源
#
# 这个文件是公开 issue 正文的唯一来源。公开 issue 是生成物，不要直接编辑 issue 正文。
# 规范见同目录 README.md。改动后必须跑：
#     python3 scripts/roadmap/render.py --check
#
# 硬规则
#     1. ID 格式 T-NNN，从 T-001 开始连续递增
#     2. 已经分配过的 ID 永不复用、永不重排、永不修改
#     3. 只追加，不重排已有条目
#     4. title 和 title_zh 必须同时提供；note 和 note_zh 必须同时提供
#        （校验器会强制，防止中英漂移）
#
# 字段说明
#     id         必填  字符串，格式 T-NNN（至少 3 位数字，不足补零）
#     title      必填  字符串，英语，一句话说清"要达成什么"
#     title_zh   必填  字符串，中文对应说法
#     difficulty 必填  easy / medium / hard / expert
#                       easy   = 一个文件，不需要架构知识，本地可自测
#                       medium = 需要理解一个子模块，跨 2-3 个文件
#                       hard   = 工程量大的已知路径（移植、重构、搬到已有后端）
#                       expert = 原创开发，方法尚未确定，需要先设计
#     domain     必填  vision / audio / tts / duplex / server / model / ggml
#                       / conversion / python / build / docs / devops / demo / app
#     issue      可选  整数，已存在的 GitHub issue 编号（不带 #）
#     owner      可选  字符串，认领者 GitHub 用户名（不带 @）
#     note       可选  字符串，英语补充说明
#     note_zh    必填  当 note 存在时；中文对应说明
#     umbrella   可选  布尔，标记为伞形条目（下面可以挂子任务）
#     parent     可选  字符串，指向所属伞形条目的 ID
#     kind       可选  task（默认）/ research
#
# 注意：跨仓库任务（domain 为 demo 或 app）不修改本仓库代码，note 里写明了实际仓库，
# 认领时请到对应仓库开 issue 与 PR。


# ===========================================================================
# Easy
# ===========================================================================

[[tasks]]
id = "T-001"
title = "Update and improve the README"
title_zh = "支持修改 README 页面"
difficulty = "easy"
domain = "docs"
note = "Keep it accurate and useful for newcomers: check that the documented commands still work, and fix whatever is stale."
note_zh = "保持 README 准确、对新人有用：核对文档里的命令是否还能跑通，把过时的部分改掉。"

[[tasks]]
id = "T-002"
title = "Add more use cases with sample inputs and expected output"
title_zh = "添加更多用例 case"
difficulty = "easy"
domain = "docs"
note = "Pick a realistic scenario, run it against the shipped model, and write it up with the exact commands and the output you got."
note_zh = "挑一个真实场景，用官方模型跑一遍，把确切命令和实际输出写成一份用例。"

[[tasks]]
id = "T-003"
title = "Add more measured results to the docs"
title_zh = "添加更多实测结果"
difficulty = "easy"
domain = "docs"
note = "Measured numbers are only available for a couple of setups today. If you run the shipped benchmarks on your own hardware, please contribute the results and state the exact configuration."
note_zh = "目前实测数据只覆盖少量配置。如果你在自己的硬件上跑了官方 benchmark，欢迎把结果补进来，并把配置写清楚。"

[[tasks]]
id = "T-004"
title = "Test the cpp backend demo on different platforms"
title_zh = "测试不同平台的 cpp 后端 demo"
difficulty = "easy"
domain = "demo"
note = "Cross-repo: OpenBMB/MiniCPM-o-Demo (Comni branch). This is the Python demo we provide, wired to the cpp backend. A testing task, not a fixing task - report what you find."
note_zh = "跨仓库：OpenBMB/MiniCPM-o-Demo（Comni 分支）。就是我们提供的那个 py demo，接的是 cpp 后端。这是测试任务不是修复任务，把发现的问题报告出来即可。"


