[[tasks]]
id = "T-008"
title = "Integrate omni inference into the MiniCPM-V app"
title_zh = "将 V 的 app 整合 omni 推理"
difficulty = "medium"
domain = "app"
note = "Cross-repo: OpenBMB/MiniCPM-V-Apps. Running omni on device is still heavy, so this is about talking to a local or cloud llama-omni-server rather than running the model locally."
