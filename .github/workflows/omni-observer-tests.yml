name: Omni decode observations

on:
  push:
    branches: [master]
    paths: ['tools/omni/omni.cpp', 'tools/omni/omni.h', 'tools/omni/test/test_decode_observer.py', '.github/workflows/omni-observer-tests.yml']
  pull_request:
    paths: ['tools/omni/omni.cpp', 'tools/omni/omni.h', 'tools/omni/test/test_decode_observer.py', '.github/workflows/omni-observer-tests.yml']

permissions:
  contents: read

jobs:
  observer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/omni/test -p 'test_decode_observer.py' -v
